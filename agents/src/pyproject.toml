[project]
name = "autifyme_agents"
version = "0.1.0"
description = "The agentic service for the AutifyME Business OS."
authors = [{ name = "Abhi" }]
requires-python = ">=3.12"
dependencies = [
    # Core Agentic Framework (LangChain v1 stable)
    "langchain>=1.0.2",
    "langgraph>=1.0.1",
    "langgraph-prebuilt>=1.0.1",
    "langgraph-checkpoint>=3.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langsmith",
    # Advanced Agent Implementation
    "deepagents>=0.2.0",  # Latest stable release (Oct 28, 2025) - OpenAI schema fixes
    # LLM Providers (v1 stable)
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai",
    # Research & Web Tools
    "langchain-tavily>=0.2.11",
    # Database & Storage
    "supabase",
    "psycopg[binary]>=3.2.10",  # Required for LangGraph PostgreSQL checkpointer
    # Data Validation & Settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "pillow>=10.0.0",  # Image processing for Vision API optimization
    # Webhook stack
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
]

[tool.uv]
# uv configuration
# prerelease = "allow"  # No longer needed - using stable v1 releases
