# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

codecov:
  # Disable the max age check for uploads
  max_report_age: false

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        # Don't fail CI if coverage drops slightly
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

# Ignore certain paths from coverage
ignore:
  - "tests/**/*"
  - "**/__init__.py"
  - "**/conftest.py"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
