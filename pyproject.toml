[project]
name = "autifyme_agents"
version = "0.1.0"
description = "The agentic service for the AutifyME Business OS."
readme = "README.md"
license = {text = "Proprietary"}
authors = [{ name = "Abhi" }]
requires-python = ">=3.12"
keywords = [
    "langchain",
    "langgraph",
    "agents",
    "whatsapp",
    "business-automation",
    "agentic-workflows",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Core Agentic Framework (LangChain v1 stable)
    "langchain==1.0.0",
    "langgraph==1.0.0",
    "langgraph-prebuilt==1.0.0",
    "langgraph-checkpoint==2.1.2",
    "langgraph-checkpoint-postgres==2.0.25",
    "langsmith",
    # Advanced Agent Implementation
    "deepagents==0.1.1",  # Stable v1-compatible release (Oct 18, 2025)
    # LLM Providers (v1 stable)
    "langchain-openai==1.0.0",
    "langchain-anthropic==1.0.0",
    "langchain-google-genai",
    # Database & Storage
    "supabase",
    "psycopg[binary]>=3.2.10",  # Required for LangGraph PostgreSQL checkpointer
    # Data Validation & Settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "pillow>=10.0.0",  # Image processing for Vision API optimization
    # Webhook stack
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
]

[project.urls]
Homepage = "https://github.com/akeshr/AutifyME"
Repository = "https://github.com/akeshr/AutifyME"
Issues = "https://github.com/akeshr/AutifyME/issues"
Documentation = "https://github.com/akeshr/AutifyME/tree/main/docs"

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",

    # Code Quality
    "ruff>=0.5.0",
    "mypy>=1.10.0",

    # E2E Testing
    "playwright>=1.40.0",
]

[tool.uv]
# uv configuration
# prerelease = "allow"  # No longer needed - using stable v1 releases

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib - enforce pathlib over os.path
]
ignore = [
    "F821",  # Undefined name (false positives in some cases)
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# E402: Module level import not at top of file - intentional in test scripts that use load_dotenv()
"tests/e2e/run_*.py" = ["E402"]
"tests/e2e/test_*.py" = ["E402"]
"tests/cli/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["autifyme_agents"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "deepagents.*",
    "supabase.*",
    "playwright.*",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["agents/src/autifyme_agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
