[project]
name = "autifyme_agents"
version = "0.1.0"
description = "The agentic service for the AutifyME Business OS."
authors = [{ name = "Abhi", email = "" }]
requires-python = ">=3.11"
dependencies = [
    # Core Agentic Framework (LangChain v1 prerelease stack)
    "langchain==1.0.0a12",
    "langgraph==1.0.0a4",
    "langgraph-prebuilt==0.7.0a2",
    "langgraph-checkpoint==2.1.1",
    "langgraph-checkpoint-postgres==2.0.24",
    "langsmith",
    # Advanced Agent Implementation
    "deepagents==0.0.11",  # Use stable 0.0.11, not 0.0.11rc1 (has API bug)
    # LLM Providers (v1 alpha)
    "langchain-openai==1.0.0a3",
    "langchain-anthropic==1.0.0a2",
    "langchain-aws==1.0.0a1",
    "langchain-google-genai",
    # Database & Storage
    "supabase",
    # Data Validation & Settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    # UI (MVP)
    "streamlit>=1.30.0",
    # Webhook stack
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    
    # Code Quality
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    
    # E2E Testing
    "playwright>=1.40.0",
]

[tool.uv]
# uv configuration
dev-dependencies = []
prerelease = "allow"  # Required for LangChain v1 alpha packages

[tool.ruff.lint]
# Ruff linting configuration
ignore = ["F821"]  # Ignore undefined name errors (false positives in some cases)

[tool.hatch.build.targets.wheel]
packages = ["agents/src/autifyme_agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

