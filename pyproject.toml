[project]
name = "autifyme_agents"
version = "0.1.0"
description = "The agentic service for the AutifyME Business OS."
readme = "README.md"
license = {text = "Proprietary"}
authors = [{ name = "Abhi" }]
requires-python = ">=3.12"
keywords = [
    "langchain",
    "langgraph",
    "agents",
    "whatsapp",
    "business-automation",
    "agentic-workflows",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Core Agentic Framework (LangChain v1 stable)
    "langchain>=1.1.0",
    "langgraph>=1.0.4",
    "langgraph-prebuilt>=1.0.5",
    "langgraph-checkpoint>=3.0.1",
    "langgraph-checkpoint-postgres>=3.0.1",
    "langsmith>=0.4.49",
    # Advanced Agent Implementation
    "deepagents>=0.2.8",  # Latest stable release (Nov 24, 2025)
    # LLM Providers (v1 stable)
    "langchain-openai>=1.1.0",
    "langchain-anthropic>=1.2.0",
    "langchain-google-genai>=3.2.0",
    # Research & Web Tools
    "langchain-tavily>=0.2.13",  # Web search & content extraction (Tavily API)
    # Database & Storage
    "supabase>=2.24.0",
    "psycopg[binary]>=3.2.13",  # Required for LangGraph PostgreSQL checkpointer
    # Data Validation & Settings
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # Utilities
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.2",
    "pillow>=12.0.0",  # Image processing for Vision API optimization
    # Webhook stack
    "fastapi>=0.123.0",
    "uvicorn>=0.38.0",
]

[project.urls]
Homepage = "https://github.com/akeshr/AutifyME"
Repository = "https://github.com/akeshr/AutifyME"
Issues = "https://github.com/akeshr/AutifyME/issues"
Documentation = "https://github.com/akeshr/AutifyME/tree/main/docs"

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.148.4",  # Property-based testing

    # Code Quality
    "ruff>=0.14.7",
    "mypy>=1.19.0",

    # E2E Testing
    "playwright>=1.56.0",
]

[tool.uv]
# uv configuration
# prerelease = "allow"  # No longer needed - using stable v1 releases

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib - enforce pathlib over os.path
]
ignore = [
    "F821",  # Undefined name (false positives in some cases)
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# E402: Module level import not at top of file - intentional in test scripts that use load_dotenv()
"tests/e2e/run_*.py" = ["E402"]
"tests/e2e/test_*.py" = ["E402"]
"tests/cli/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["autifyme_agents"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "deepagents.*",
    "supabase.*",
    "playwright.*",
]
ignore_missing_imports = true

# External libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "google.genai",
    "google.genai.live",
    "google",
]
ignore_missing_imports = true

# Adapter layer - interfaces with Supabase SDK which has incomplete type stubs
# (response.data typed as JSON union instead of actual dict/list types)
[[tool.mypy.overrides]]
module = "autifyme_agents.integrations.storage.supabase_client"
disable_error_code = ["return-value", "assignment", "arg-type", "index", "operator", "union-attr", "call-overload"]

