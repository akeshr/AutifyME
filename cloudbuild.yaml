# ============================================================================
# Cloud Build CI/CD Pipeline for AutifyME Agents
# ============================================================================
# Builds container image and deploys to Cloud Run
#
# Required substitutions (set in Cloud Build trigger or command line):
#   _SERVICE_NAME: Cloud Run service name (default: autifyme-webhook)
#   _REGION: GCP region (default: asia-south1)
#   _MIN_INSTANCES: Minimum instances (default: 0)
#   _MAX_INSTANCES: Maximum instances (default: 10)
#
# Required secrets in Secret Manager:
#   - SUPABASE_URL
#   - SUPABASE_ANON_KEY
#   - DATABASE_URL
#   - WHATSAPP_PHONE_NUMBER_ID
#   - WHATSAPP_BUSINESS_ACCOUNT_ID
#   - WHATSAPP_ACCESS_TOKEN
#   - WHATSAPP_WEBHOOK_VERIFY_TOKEN
#   - OPENAI_API_KEY
#   - GOOGLE_API_KEY
#   - LANGCHAIN_API_KEY
#   - TAVILY_API_KEY
# ============================================================================

substitutions:
  _SERVICE_NAME: autifyme-webhook
  _REGION: asia-south1
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"

steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'
    id: 'build'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
    id: 'push-sha'
    waitFor: ['build']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
    id: 'push-latest'
    waitFor: ['build']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--concurrency=80'
      # Secrets from Secret Manager
      - '--set-secrets=SUPABASE_URL=SUPABASE_URL:latest'
      - '--set-secrets=SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-secrets=WHATSAPP_PHONE_NUMBER_ID=WHATSAPP_PHONE_NUMBER_ID:latest'
      - '--set-secrets=WHATSAPP_BUSINESS_ACCOUNT_ID=WHATSAPP_BUSINESS_ACCOUNT_ID:latest'
      - '--set-secrets=WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest'
      - '--set-secrets=WHATSAPP_WEBHOOK_VERIFY_TOKEN=WHATSAPP_WEBHOOK_VERIFY_TOKEN:latest'
      - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest'
      - '--set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest'
      - '--set-secrets=LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest'
      - '--set-secrets=TAVILY_API_KEY=TAVILY_API_KEY:latest'
      # Environment variables (non-secrets)
      - '--set-env-vars=LANGCHAIN_TRACING_V2=true'
      - '--set-env-vars=LANGCHAIN_ENDPOINT=https://api.smith.langchain.com'
      - '--set-env-vars=LANGCHAIN_PROJECT=autifyme-prod'
      - '--set-env-vars=WHATSAPP_API_VERSION=v23.0'
      - '--set-env-vars=AGENT_RECURSION_LIMIT=50'
    id: 'deploy'
    waitFor: ['push-sha']

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

# Build timeout (container builds can take a while)
timeout: '1200s'
