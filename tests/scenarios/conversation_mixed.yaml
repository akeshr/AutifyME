name: "Mixed Conversation Flow"
description: "Mix of greetings, questions, and cataloging - tests PM's ability to handle context switches"
sender: "test_user_mixed"
hitl_mode: "auto_approve"

turns:
  - turn: 1
    text: "Hello!"
    wait: 0.3
    expected_intent: "conversational"
    validate_context:
      - no_pending_approval: true

  - turn: 2
    text: "What products do we have in stock?"
    wait: 0.5
    expected_intent: "inquiry"
    validate_context:
      - no_pending_approval: true

  - turn: 3
    text: "Okay, let me add a new one then. These canvas sneakers are $79.99"
    media: "test_images/sneaker.jpg"
    media_type: "image"
    wait: 1.0
    expected_intent: "cataloging"
    validate_context:
      - pending_approval: true

  # Approval happens automatically

  - turn: 4
    text: "Thanks! Can you show me the product details?"
    wait: 0.5
    expected_intent: "inquiry"
    validate_context:
      - no_pending_approval: true
