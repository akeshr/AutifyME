name: "Clarification Question Flow"
description: "Ambiguous request leads to PM asking clarifying questions, user provides answer"
sender: "test_user_clarification"
hitl_mode: "auto_approve"

turns:
  - turn: 1
    text: "I want to add a product"
    wait: 0.5
    expected_intent: "cataloging"
    validate_context:
      - conversation_history_length: 1  # PM asks for clarification
      - no_pending_approval: true

  - turn: 2
    text: "It's canvas sneakers, white color, price $79.99"
    wait: 0.5
    expected_intent: "cataloging"
    validate_context:
      - conversation_history_length: 2  # User provided info

  - turn: 3
    media: "test_images/sneaker.jpg"
    media_type: "image"
    wait: 1.0
    expected_intent: "cataloging"
    validate_context:
      - pending_approval: true
