name: CI/CD Pipeline

# CI/CD pipeline for AutifyME agent system
on:
  push:
    branches: [ main, develop, InitialDesign ]
  pull_request:
    branches: [ main, develop, InitialDesign ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        SUPABASE_URL: https://dummy.supabase.co
        SUPABASE_ANON_KEY: dummy_anon_key
        WHATSAPP_PHONE_NUMBER_ID: dummy_phone_id
        WHATSAPP_ACCESS_TOKEN: dummy_access_token
        WHATSAPP_WEBHOOK_VERIFY_TOKEN: dummy_verify_token
        LANGCHAIN_API_KEY: dummy_langsmith_key
        OPENAI_API_KEY: dummy_openai_key
      run: |
        uv run pytest agents/tests --cov=autifyme_agents --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./agents/coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Run Ruff linter
      env:
        SUPABASE_URL: https://dummy.supabase.co
        SUPABASE_ANON_KEY: dummy_anon_key
        WHATSAPP_PHONE_NUMBER_ID: dummy_phone_id
        WHATSAPP_ACCESS_TOKEN: dummy_access_token
        WHATSAPP_WEBHOOK_VERIFY_TOKEN: dummy_verify_token
        LANGCHAIN_API_KEY: dummy_langsmith_key
        OPENAI_API_KEY: dummy_openai_key
      run: |
        uv run ruff check agents/src

    - name: Run MyPy type checker
      env:
        SUPABASE_URL: https://dummy.supabase.co
        SUPABASE_ANON_KEY: dummy_anon_key
        WHATSAPP_PHONE_NUMBER_ID: dummy_phone_id
        WHATSAPP_ACCESS_TOKEN: dummy_access_token
        WHATSAPP_WEBHOOK_VERIFY_TOKEN: dummy_verify_token
        LANGCHAIN_API_KEY: dummy_langsmith_key
        OPENAI_API_KEY: dummy_openai_key
      run: |
        uv run mypy agents/src/autifyme_agents

  deploy-to-railway:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Install Railway CLI
      run: |
        curl -fsSL https://railway.app/install.sh | sh
        echo "$HOME/.railway/bin" >> $GITHUB_PATH

    - name: Deploy to Railway
      run: |
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway deploy --project ${{ secrets.RAILWAY_PROJECT_ID }}
