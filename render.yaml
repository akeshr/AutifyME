services:
  - type: web
    name: autifyme-webhook
    env: python
    buildCommand: "pip install uv && uv pip install -r pyproject.toml"
    startCommand: "uvicorn autifyme_agents.entrypoints.whatsapp_webhook:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: agents/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
